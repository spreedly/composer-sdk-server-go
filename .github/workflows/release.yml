name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Go module proxy serves a version as soon as its tag is pushed, so these
  # checks can only flag a bad release, not stop it. This job runs all
  # dependency code (Go tools, tests) and can't write to the repository.
  build:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the main ancestry check can see main.
          fetch-depth: 0
          persist-credentials: false

      # The latest Go, so govulncheck only reports what users can't fix by
      # updating Go themselves. No cache, so the tests and tools build clean
      # instead of from the caches CI saves on main.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Check tag, version and CHANGELOG.md
        id: check
        run: |
          MODULE="$(go list -m)"
          VERSION="$(sed -n -E 's/^const Version = "([^"]+)"$/\1/p' utilities.go)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Version ${VERSION} in utilities.go"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
          HEADING="$(grep -m1 -E "^## ${VERSION//./\\.}( |$)" CHANGELOG.md || true)"
          if [[ -z "${HEADING}" || "${HEADING,,}" == *unreleased* ]]; then
            echo "CHANGELOG.md needs a released '## ${VERSION}' section"
            exit 1
          fi
          awk -v v="${VERSION}" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          echo "module=${MODULE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # go install checks each module against sum.golang.org, so the version
      # pins the code that runs.
      - name: Audit and write SBOM
        env:
          GOVULNCHECK_VERSION: v1.9.0
          CYCLONEDX_GOMOD_VERSION: v1.12.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          BIN="$(go env GOPATH)/bin"
          "${BIN}/govulncheck" ./...
          "${BIN}/cyclonedx-gomod" mod -type library -licenses -assert-licenses -short-purls -output-version 1.7 -json -output sbom.cdx.json

      # Waits for the Go module proxy to serve this version from this commit,
      # then downloads the module zip users get, which go mod download checks
      # against sum.golang.org. The proxy never changes a version's zip once
      # it has one, so a checksum of the zip stays valid.
      - name: Check the Go module proxy and download the module zip
        id: archive
        shell: bash
        env:
          MODULE: ${{ steps.check.outputs.module }}
          VERSION: ${{ steps.check.outputs.version }}
          GOPROXY: https://proxy.golang.org
          WAIT_SECONDS: 600
        run: |
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          until COMMIT="$(curl -sSf "${GOPROXY}/${MODULE}/@v/v${VERSION}.info" | jq -r '.Origin.Hash // empty')" && [[ -n "${COMMIT}" ]]; do
            if (( SECONDS >= DEADLINE )); then
              echo "The Go module proxy doesn't list ${MODULE} v${VERSION} after ${WAIT_SECONDS} seconds"
              exit 1
            fi
            sleep 30
          done
          if [[ "${COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "The Go module proxy serves ${MODULE} v${VERSION} from ${COMMIT}, not ${GITHUB_SHA}"
            exit 1
          fi
          # Run outside this module, which can't download a version of itself.
          ZIP="$(cd "${RUNNER_TEMP}" && GOMODCACHE="${RUNNER_TEMP}/modcache" go mod download -json "${MODULE}@v${VERSION}" | jq -r .Zip)"
          ARCHIVE="${GITHUB_REPOSITORY#*/}-${VERSION}.zip"
          cp "${ZIP}" "${ARCHIVE}"
          sha256sum "${ARCHIVE}" > SHA256SUMS
          mkdir "${RUNNER_TEMP}/package"
          unzip -q "${ARCHIVE}" -d "${RUNNER_TEMP}/package"
          echo "root=${RUNNER_TEMP}/package" >> "${GITHUB_OUTPUT}"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      # Scans the files users receive. The hash pins the download; --redact
      # keeps a found secret's value out of the public log while --verbose
      # still shows where it is.
      - name: Scan module for secrets
        env:
          ROOT: ${{ steps.archive.outputs.root }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          ./gitleaks dir "${ROOT}" --redact --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.archive.outputs.archive }}
            SHA256SUMS
            sbom.cdx.json
            release-notes.md

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md "./${ARCHIVE}" SHA256SUMS sbom.cdx.json
